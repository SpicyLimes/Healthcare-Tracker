services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/spicylimes/healthcare-tracker-backend:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    image: ghcr.io/spicylimes/healthcare-tracker-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "1337:80"
    restart: unless-stopped

  backup:
    image: ghcr.io/spicylimes/healthcare-tracker-backup:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - ${BACKUP_HOST_PATH}:/backups
    restart: unless-stopped

# ---------------------------------------------------------------
# Quick Start:
#   1. cp .env.example .env
#   2. Fill in all CHANGE_ME values in .env
#   3. docker compose -f docker-compose.prod.yml up -d
#
# The app runs on port 1337. How you expose it (reverse proxy,
# Cloudflare Tunnel, VPN, etc.) is up to you.
# Nightly backups are written to BACKUP_HOST_PATH (default: ./backups).
# ---------------------------------------------------------------

volumes:
  db_data:
  uploads_data:
