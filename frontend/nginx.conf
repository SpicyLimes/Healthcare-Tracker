# Log requests without the query string: guest share tokens travel as
# ?token=... and must not land in access logs. (This file is included inside
# the http block, so log_format is legal here.)
log_format noquery '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log noquery;

    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # Serve the SPA: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend service on the compose network.
    # resolver + variable defers DNS lookup so nginx starts even without backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        # X-Real-IP is the rate-limiter's source of truth. $remote_addr is the
        # real immediate peer and overwrites any client-supplied X-Real-IP, so
        # it cannot be forged. Strip CF-Connecting-IP/X-Forwarded-For so a client
        # on the LAN/Tailscale paths (which bypass Cloudflare) can't inject a
        # fake client IP that downstream code might trust.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 620s;  # outlasts the 600s backend httpx timeout
    }

    # Backup uploads can be large; scope the higher body limit to this route
    # only. proxy_set_header does not inherit across locations, so the
    # header hygiene above is repeated deliberately.
    location = /api/backups/upload {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 620s;
    }
}
