services:
  testdb:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    tmpfs:
      - /var/lib/postgresql/data   # in-memory: no disk I/O, no volume left behind
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 3s
      timeout: 3s
      retries: 10

  test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://testuser:testpass@testdb:5432/testdb
    volumes:
      - ./backend:/app   # mount source so no rebuild needed when code changes
    depends_on:
      testdb:
        condition: service_healthy
